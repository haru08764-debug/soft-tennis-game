    <style>

      #btns.serve-mode #b1{right:0;bottom:0;width:96px;height:96px}#btns.serve-mode #b4{right:106px;bottom:6px;width:82px;height:82px}#btns.serve-mode #b2,#btns.serve-mode #b3,#btns.serve-mode #b5,#btns.serve-mode #b6{display:none}
      @media(orientation:portrait){#b4{width:64px;height:64px;right:112px;bottom:78px}#b5{width:58px;height:58px;right:112px;bottom:144px}#b6{width:60px;height:60px;left:0;bottom:94px;font-size:10px}}
      /* ===== DADS準拠(色は変数。公式値が確認できたらここだけ差し替える) ===== */
      :root{--d-blue:#0017C1;--d-blue-h:#00118F;--d-blue-a:#000971;--d-tint:#E8F1FE;--d-tint-a:#C5D7FB;--d-text:#1A1A1A;--d-sub:#4D4D4D;--d-line:#767676;--d-yellow:#FFD43D}
      body{font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif}
      :focus-visible{outline:4px solid var(--d-yellow);outline-offset:2px;box-shadow:0 0 0 2px #000}
      #ov{background:rgba(0,0,0,.6);-webkit-backdrop-filter:none;backdrop-filter:none;gap:0;padding:16px}
      .dlg{background:#fff;color:var(--d-text);width:min(640px,100%);border-radius:12px;padding:24px;text-align:left;box-shadow:0 8px 32px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:16px;font-size:16px;line-height:1.7}
      #ov h1{font-size:clamp(22px,4vw,28px);margin:0;color:var(--d-text);text-shadow:none;letter-spacing:0;line-height:1.4}
      #ov h1:focus-visible{outline:none;box-shadow:none}
      .lead,.dlg p{margin:0;color:var(--d-sub)}
      fieldset{border:0;margin:0;padding:0;min-width:0}legend{font-weight:700;padding:0;margin-bottom:4px}
      .rds{display:flex;flex-wrap:wrap;gap:4px 20px}
      .rd{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
      .rd input{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin:0;border:2px solid var(--d-line);border-radius:50%;background:#fff;flex:none}
      .rd input:checked{border-color:var(--d-blue);background:radial-gradient(circle,var(--d-blue) 0 45%,#fff 50%)}
      .act{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
      .bt{min-height:48px;min-width:96px;padding:8px 24px;border:2px solid var(--d-blue);border-radius:8px;background:#fff;color:var(--d-blue);font-size:16px;font-weight:700;margin:0;-webkit-backdrop-filter:none;backdrop-filter:none}
      .bt:hover{background:var(--d-tint);color:var(--d-blue-h);text-decoration:underline}.bt:active{background:var(--d-tint-a);color:var(--d-blue-a)}
      .bt.go{background:var(--d-blue);color:#fff}.bt.go:hover{background:var(--d-blue-h);color:#fff}.bt.go:active{background:var(--d-blue-a);color:#fff}
      .bt.txt{border-color:transparent;background:transparent;text-decoration:underline}
      .hl{color:var(--d-sub);font-size:14px;line-height:1.8;max-width:none;text-align:left}
      .hl summary{cursor:pointer;color:var(--d-blue);font-weight:700;min-height:44px;display:flex;align-items:center}
      .res{font-size:24px;font-weight:700}
      #btns{left:0;right:0;width:auto;height:0;transform:none!important;pointer-events:none}.b{pointer-events:auto}
      body.lh #jz{left:auto;right:0}body.lh #jb{left:auto;right:calc(28px + env(safe-area-inset-right,0px))}
      #edit{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff;color:var(--d-text);border:1px solid var(--d-line);border-radius:8px;padding:10px 12px;z-index:12;width:max-content;max-width:94vw;box-shadow:0 4px 16px rgba(0,0,0,.35);font-size:14px}
      #edit[hidden]{display:none}#edit p{margin:0 0 8px}#edit .bt{min-height:44px;padding:6px 16px}
      .fld label{display:block;font-weight:700;margin-bottom:4px}.row{display:flex;gap:8px;align-items:stretch}
      .fld input{flex:1;min-width:0;min-height:48px;padding:8px 12px;border:2px solid var(--d-line);border-radius:8px;font-size:24px;letter-spacing:.2em;text-transform:uppercase;text-align:center;background:#fff;color:var(--d-text)}
      .dlg .code{font-size:48px;font-weight:700;letter-spacing:.25em;text-align:center;color:var(--d-blue);margin:0;-webkit-user-select:all;user-select:all}.tl{margin:0;padding-left:0;list-style:none;font-size:14px}
      @media(max-width:480px){.act{flex-direction:column-reverse}.act .bt{width:100%}}
      #sb{background:rgba(255,255,255,.95);color:var(--d-text);border:1px solid var(--d-line);box-shadow:0 2px 8px rgba(0,0,0,.25);-webkit-backdrop-filter:none;backdrop-filter:none;opacity:1;border-radius:8px;font-weight:700}
      #sb .r b:last-child{background:var(--d-tint);color:var(--d-blue);border-radius:4px}
      #sb .r i{border:1px solid var(--d-line)}#sb .r i.on{background:var(--d-blue);border-color:var(--d-blue);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--d-blue)}
      #hh{color:var(--d-sub);font-weight:400}
      #pz,#mt{width:44px;height:44px;border-radius:8px;border:2px solid var(--d-blue);background:#fff;color:var(--d-blue);font-size:18px;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
      #mt{right:calc(62px + env(safe-area-inset-right,0px))}#viewBtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(114px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:8px;border:2px solid var(--d-blue);background:#fff;color:var(--d-blue);font-size:13px;font-weight:800;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.25);touch-action:manipulation}#fovBtn{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));right:calc(114px + env(safe-area-inset-right,0px));height:36px;min-width:52px;padding:0 8px;border:2px solid var(--d-blue);border-radius:8px;background:#fff;color:var(--d-blue);font-size:12px;font-weight:800;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.2);touch-action:manipulation}#fovPanel{position:fixed;top:calc(102px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));width:min(240px,calc(100vw - 16px));padding:12px;border:1px solid #aab7c4;border-radius:10px;background:rgba(255,255,255,.96);color:#18212b;z-index:8;box-shadow:0 4px 18px rgba(0,0,0,.22)}#fovPanel[hidden]{display:none}#fovPanel label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}#fovRange{display:block;width:100%;margin:12px 0 4px;accent-color:#1769aa;touch-action:pan-x}.fovEnds{display:flex;justify-content:space-between;font-size:11px;color:#4b5563}#viewBtn[aria-pressed=true]{background:var(--d-blue);color:#fff}#mt[aria-pressed=true]{background:var(--d-blue);color:#fff}
      #msg{left:50%;right:auto;width:max-content;max-width:92vw;transform:translateX(-50%);background:var(--d-text);color:#fff;border-radius:8px;padding:8px 20px;font-size:clamp(18px,4vw,28px);text-shadow:none;line-height:1.4}
      #hint{background:#fff;color:var(--d-text);border:1px solid var(--d-line);border-radius:8px;-webkit-backdrop-filter:none;backdrop-filter:none;font-size:clamp(12px,2.4vw,14px);box-shadow:0 2px 8px rgba(0,0,0,.25)}
      .b{background:#fff;color:var(--d-blue);border:2px solid var(--d-blue);box-shadow:0 2px 8px rgba(0,0,0,.35);-webkit-backdrop-filter:none;backdrop-filter:none;letter-spacing:0;font-weight:700}
      .b:active{background:var(--d-tint-a);color:var(--d-blue-a);text-decoration:underline}
      #b1{background:var(--d-blue);color:#fff;border-color:#fff}#b1:active{background:var(--d-blue-a);color:#fff}
      #jb{background:rgba(255,255,255,.35);border:2px solid #fff;-webkit-backdrop-filter:none;backdrop-filter:none}#jk{background:#fff;border:2px solid var(--d-blue)}
      @media(prefers-reduced-motion:reduce){*{transition:none!important}}
      @media(orientation:landscape) and (max-height:520px){.dlg{padding:16px;gap:8px}#ov h1{font-size:20px}.hl{font-size:12px}}

      .ver{margin:0;color:#667085;font-size:12px;font-weight:700;letter-spacing:.08em;text-align:center}
      #serveAim{display:none;position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(108px + env(safe-area-inset-top,0px));z-index:20;gap:6px;padding:6px;background:rgba(255,255,255,.98);border:1px solid var(--d-line);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:auto;isolation:isolate}
      #serveAim button{min-height:42px;padding:6px 12px;border:2px solid var(--d-blue);border-radius:7px;background:#fff;color:var(--d-blue);font-size:14px;font-weight:700;touch-action:manipulation}
      #serveAim button[aria-pressed=true]{background:var(--d-blue);color:#fff}

      /* サーブ中は操作ガイドをコース選択ボタンから分離して配置 */
      #hint.serving{top:calc(166px + env(safe-area-inset-top,0px));bottom:auto;left:50%;right:auto;transform:translateX(-50%);max-width:min(92vw,560px);white-space:normal;text-align:center;line-height:1.45}

      /* ドパガキモード：視界を塞ぎすぎず、派手な演出を重ねる */
      #dopFx{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden;opacity:0}
      #dopFx .dopFlash{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.95),rgba(255,220,0,.35) 22%,rgba(255,0,100,.16) 55%,transparent 72%);opacity:0}
      #dopFx .dopBanner{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.45) rotate(-5deg);font-weight:1000;font-size:clamp(28px,9vw,76px);font-style:italic;letter-spacing:.04em;white-space:nowrap;color:#fff;text-shadow:0 4px 0 #f04,3px 7px 0 #401bff,0 0 22px #ffef00,-2px -2px 0 #111;opacity:0;-webkit-text-stroke:1px #111}
      #dopFx.pop .dopFlash{animation:dopFlash .42s ease-out}#dopFx.pop .dopBanner{animation:dopBanner .7s cubic-bezier(.15,1.5,.3,1) both}#dopFx.pop{opacity:1}
      @keyframes dopFlash{0%{opacity:0}12%{opacity:.9}100%{opacity:0}}
      @keyframes dopBanner{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(3deg)}72%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2) rotate(0)}}
      body.dopShake #app{animation:dopShake .22s linear}@keyframes dopShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,2px)}}
      @media(prefers-reduced-motion:reduce){#dopFx.pop .dopFlash,#dopFx.pop .dopBanner,body.dopShake #app{animation:none!important}}
      /* ドパガキMAX：UI全部が虹色で暴れるモード */

      <details class="hl"><summary>操作方法とルール</summary><b>PC</b> WASD移動 / Shift ダッシュ / 左クリック ショット / 右クリック ロブ / Space 強打・スマッシュ / E スライス / R トップスピン / P ポーズ<br>狙い: 打つ時の移動キー(A/D 左右、W 短く、S 深く)<br><b>スマホ</b> 左: スティック移動(強く倒すとダッシュ) 右: SHOT / LOB / SMASH / SLICE<br><b>サーブ</b> SHOTでトス → SHOTで通常サーブ / SLICEでカットサーブ(高い位置ほど正確・2本まで)。ベースライン後方・センターの手前から打つ<br><b>ルール</b> 4ポイント先取(3-3でデュース・2点差)/ 7ゲームは4ゲーム先取、3-3はファイナルゲーム(7ポイント先取・2点差) / 2ポイントごとにサーブ交代 / サーバーは左右交互 / ネットに触れて入ったサーブはレット / フットフォルト・タッチネット・相手コート侵入は失点</details><details class="hl"><summary>パッチノート</summary><b>v1.16.0</b><br>・ダブルスで自分が前衛ならCPUを後衛寄りに配置。CPU前衛のスマッシュ・ボレー選択率を上昇。サーブ速度のみをコート脇のドット表示計に表示し、中央の速度表示を廃止。<br><b>v1.15.2</b><br>・シングルスではポジション選択を非表示にし、後衛固定に変更。ダブルスでは引き続き選択可能。<br><b>v1.15.1</b><br>・VOLLEYボタンも操作設定のドラッグ移動・位置保存・リセットの対象に追加。<br><b>v1.15.0</b><br>・自分のポジションに「前衛／後衛」を追加。前衛はネット寄りでレシーブし、サーブ時は打ったあと前へ詰める。<br><b>v1.14.0</b><br>・前衛向けの新ショット「VOLLEY」を追加。ボレー専用の低く速い弾道と短いスイングを実装。<br><b>v1.13.0</b><br>・サーブのトスを見やすく調整し、打点を逃してトスミスになりやすい問題を改善。2本目のサーブも維持し、サーブ速度表示を追加。<br>・CPUが前に詰めてボレーを狙う動き、トップスピンの沈みとスライスの横変化、走行中の上体の傾きを改善。<br>・試合ごとのポイント・エース・サーブフォルト・最速ショットを記録し、通算戦績を端末に保存。<br><b>v1.12.0</b><br>・あなた側のシャツ・差し色・ショーツ・ラケットを色変更できるカスタマイズ画面を追加。設定は自動保存。オンライン対戦の再接続時に入力状態が残らないよう通信状態のリセットも強化。<br><b>v1.11.0</b><br>・CPU対戦にダブルス(2対2)モードを追加。前衛パートナー2人がラリー中に位置取りし、届くボールを自動で返球。対人戦は従来どおり1対1。<br><b>v1.10.9</b><br>・通常のフォア／バックのフォロースルーを強化。インパクト後の上体の回旋と腕の振り抜きを伸ばし、打球ごとの動きを分かりやすく調整。<br><b>v1.10.8</b><br>・ロブ専用のスイングを追加。ラケットを後方・下側から振り上げ、打球後に高く振り抜く動きと反対腕のバランス動作を調整。<br><b>v1.10.7</b><br>・スライスショット専用のスイングを追加。高めに引いてから斜め下へ振り抜く動きと、インパクト後のフォロースルーを調整。<br><b>v1.10.6</b><br>・1バウンド後にボールがフェンスへ当たっても、打球者のアウトとして誤判定しないよう修正。バウンド前のフェンス接触は引き続きアウト判定。<br><b>v1.10.5</b><br>・スマッシュが当たりにくくなる問題を修正。スイング中に打球判定を受け付ける時間を広げ、モーション中でもボールを捉えやすく調整。<br><b>v1.10.4</b><br>・スマッシュ動作をサーブ動作から分離。高い打点で上体をひねって振りかぶり、インパクト後に腕を前方へ振り抜く専用モーションを追加。<br><b>v1.10.3</b><br>・コート面を落ち着いた青緑系に調整し、人工的なひび・目地を削減して細かな表面粒子を追加。ネット上端の白い帯状パーツを暗色の細いコードに変更。<br><b>v1.10.2</b><br>・打球者を独立して記録し、ツーバウンドやボール停止時の得点が直前の判定状態に左右されないよう修正。<br><b>v1.10.0</b><br>・GLB形式のコートとラケットモデルの読み込みに対応。読み込めない場合は従来の表示に自動で戻る。<br><b>v1.9.0</b><br>・通常ショットのカメラシェイクを大幅に弱め、ラケットで打った瞬間に発生するよう変更。スマッシュは強めの揺れを維持。<br><b>v1.8.9</b><br>・着弾リングと火花を明るく大型化。スマッシュ時のカメラシェイクを強化し、強打でも揺れが分かるように調整。<br><b>v1.8.8</b><br>・スマッシュや強打の着弾に専用カラーの衝撃リングと火花を追加。強い着弾では控えめなカメラシェイクも発生。<br><b>v1.8.7</b><br>・ショットの着弾時に多重リング、発光フラッシュ、火花パーティクルを表示。球速に応じて演出の強さを調整。<br><b>v1.8.6</b><br>・UI全体をGlassmorphismに刷新。半透明ガラス、背景ぼかし、繊細な縁取りと奥行きのある影を追加。<br><b>v1.8.5</b><br>・直前のポイントを再生するリプレイ機能を追加。CPUのコース選択・ロブ判断・回復位置・反応を調整。<br><b>v1.8.4 BETA</b><br>・ドーム型コートで「3D COURT」などの広告看板、ナイター照明の柱・灯具、木立を非表示にし、屋外オブジェクトが屋内に見える問題を改善。<br><b>v1.8.3 BETA</b><br>・ドーム型コートでは周辺環境の緑色ウィンドスクリーンとフェンス支柱を非表示にし、屋内に緑の柵が残る問題を修正。<br><b>v1.8.2 BETA</b><br>・ドーム型コートでカメラ位置と注視点を壁・屋根の内側に制限し、カメラが壁を突き抜ける問題を軽減。<br><b>v1.8.1 BETA</b><br>・体育館ドームの屋根と妻壁の接合部に押さえ材を追加し、妻壁を立体化して端の隙間を改善。<br>・木床に板ごとの色むら・木目テクスチャと控えめな光沢を追加。床の幅をドーム内側に合わせ、側壁の巾木と補助ラインも調整。<br><b>v1.8.0 BETA</b><br>・緑ケ丘公園庭球場の20面構成を参考に、周辺コート群をInstancedMeshで追加。スタンド・休憩設備・公園の木々を軽量化して配置。<br><b>v1.7.8 BETA</b><br>・コート設定に「緑ケ丘公園庭球場風（苫小牧）」を追加。<br><b>v1.7.7 BETA</b><br>・設定でオン/オフできるドパガキモードを追加。打球・得点時に派手な文字演出、フラッシュ、画面揺れを表示<br><b>v1.7.6</b><br>・説明されたカットサーブのフォームに合わせ、半身の構え・後ろ足荷重・低めのトスを調整<br>・ラケットを肩より高く引き、斜め下への擦り振りと左脇方向へのフォロースルーを強調<br>・トス側の腕の動きも調整<br><b>v1.7.5</b><br>・参考動画をもとにサーブのテイクバック、上体の回転、打点後の振り抜きを改善<br>・トス側の腕の動きも調整<br><b>v1.7.4</b><br>・弱くなりすぎたカットサーブの横変化を中間の強さに調整<br>・低い弾道とネットとの距離は維持<br><b>v1.7.3</b><br>・カットサーブの横変化が強すぎる問題を調整し、バウンド後の変化量を抑制<br><b>v1.7.2</b><br>・カットサーブを低く速い軌道に変更し、ネット付近を通るよう調整<br>・飛行中の横曲がりを抑え、バウンド時に強い横変化が出るよう変更<br><b>v1.7.1</b><br>・参考動画に合わせてカットサーブの横変化を強め、バウンド後に外へ逃げる軌道へ調整<br><b>v1.7.0</b><br>・ボール本体をソフトテニスらしい白に戻し、通常時の残像も白系に変更<br>・コートの青を自然な明るさに調整し、周囲の緑や照明との色の差を改善<br><b>v1.6.9</b><br>・ベースライン後方へさらに移動可能にし、追従カメラの範囲も拡張<br><b>v1.6.8</b><br>・白飛びを抑え、露出・照明・空と霧の色を調整<br><b>v1.6.7</b><br>・高解像度描画、ACESトーンマッピング、影・照明・テクスチャの品質を強化<br><b>v1.6.6</b><br>・カットサーブ専用フォームを追加し、横回転とバウンド後の横変化を調整<br><b>v1.6.5</b><br>・サーブ中は「上から」「カット」の2ボタンだけに切り替え、サーブ後は通常操作ボタンへ復帰<br><b>v1.6.4</b><br>・一人称視点のカメラを少し高くし、目線の低さを改善<br><b>v1.6.3</b><br>・一人称視点で胴体や頭は隠し、両腕とラケットを表示するよう調整<br><b>v1.6.2</b><br>・一人称視点では自キャラを非表示にし、頭や胴体がカメラにめり込む問題を改善<br><b>v1.6.1</b><br>・三人称視点でカメラがボールを自然に追うよう、注視点をなめらかに調整<br><b>v1.6.0</b><br>・メインメニューに設定画面を追加。視野角・視点・効果音・CPU難易度・試合形式・操作設定を一括変更可能に変更<br><b>v1.5.9</b><br>・FOVスライダーで視野角を40〜110度に調整可能に変更<br><b>v1.5.8</b><br>・視点切り替えで一人称・三人称を選択可能に変更<br>・拍手の合成音を取りやめ、従来の得点効果音に復帰<br><b>v1.5.5</b><br>・CPUがトスを開始できずサーブしない不具合を修正<br><b>v1.5.4</b><br>・予測軌道の色をボール残像と同じ打球タイプ別カラーに連動<br><b>v1.5.3</b><br>・CPU戦でも打球タイプに応じて残像の色が切り替わるよう修正<br><b>v1.5.2</b><br>・ボール残像の透明度と大きさを適度に強調し、色を見やすく調整<br><b>v1.5.1</b><br>・打球タイプごとにボールの残像色を変更（スマッシュ・スライス・トップスピン・ロブ）<br><b>v1.5.0</b><br>・飛行中のボールの予測軌道を表示<br>・最初の着地点をリングで表示し、コート内外を色分け<br><b>v1.4.8</b><br>・残っていたTOPボタン専用の緑色CSSを削除し、共通スタイルを適用<br><b>v1.4.7</b><br>・TOPボタン固有の色指定を削除し、他の操作ボタンと共通の色スタイルを適用<br><b>v1.4.6</b><br>・TOPボタンを白背景・青枠線・青文字に統一<br><b>v1.4.5</b><br>・TOPボタンの枠線と文字色を他のボタンと統一<br><b>v1.4.4</b><br>・TOPボタンを白色に変更<br><b>v1.4.3</b><br>・TOPボタンの色指定を調整<br><b>v1.4.2</b><br>・TOPボタンを明るい緑の単色に変更し、透明化するスタイルを無効化<br><b>v1.4.1</b><br>・TOPボタンの背景色を不透明に固定<br><b>v1.4.0</b><br>・トップスピンボタンの見た目を調整<br><b>v1.3.9</b><br>・スイング時の体のひねりとフォロースルーを調整<br><b>v1.3.8</b><br>・トップスピンショットを追加<br><b>v1.3.7</b><br>・対人戦の接続タイムアウト処理と再接続案内を改善</details>`) }

            credentials: 'same-origin',

          } catch (_) {
            safeToShow = true;
          }
          if (safeToShow) notice.style.display = 'block';

          try {
            const source = await getPageSource();
            if (baseline === null) {
              baseline = source;
              return;
            }
            if (source !== baseline) {
              updateFound = true;
              showUpdateWhenSafe();
            }
          } catch (_) {
            // ネットワーク一時不調時は次回のチェックで再試行する
          }
        };
        nowButton.addEventListener('click', () => {
          nowButton.disabled = true;
          nowButton.textContent = '更新中…';
          location.reload();
        });
        laterButton.addEventListener('click', () => {
          dismissed = true;
          notice.style.display = 'none';
        });
        check();
        setInterval(check, 45000);
      })();
    </script>
